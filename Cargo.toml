[package]
name = "bitcask"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
bytes = { version = "1.10.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
criterion-macro = "0.4.0"
rand = "0.9.2"
proptest = "1.9.0"
tempfile = "3.23.0"

[[bench]]
name = "lib"
harness = false
